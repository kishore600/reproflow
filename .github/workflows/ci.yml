name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --with-deps installs the system libraries Chromium needs on Linux and is a no-op elsewhere.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Check the package contents
        run: npm pack --dry-run
